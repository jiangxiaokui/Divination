<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六爻占卜 · 玄镜</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a class="nav-logo" href="/">玄 镜</a>
      <div class="nav-links">
        <a href="/my">我的</a>
        <a href="/bazi">八字</a>
        <a href="/liuyao" class="active">六爻</a>
        <a href="/dream">解梦</a>
        <a href="/compatibility">姻缘</a>
        <a href="/name-wuge">姓名</a>
        <a href="/tarot">塔罗</a>
        <a href="/lots">灵签</a>
      </div>
    </nav>
    <main class="container">
      <section class="hero panel reveal">
        <p class="eyebrow">Module · LiuYao</p>
        <h1>六爻占卜</h1>
        <p class="subtitle">输入六爻数据，右侧直接显示动静分析与最终判断。</p>
      </section>

      <section class="module-layout reveal delay-1">
        <article class="panel form-panel">
          <h2>起卦表单</h2>
          <form id="liuyaoForm" class="form">
            <div class="form-group">
              <span class="form-label">解读模式</span>
              <div class="mode-toggle">
                <button type="button" class="mode-btn active" data-mode="fast">⚡ 极速</button>
                <button type="button" class="mode-btn" data-mode="deep">🔮 深度</button>
              </div>
              <input type="hidden" name="readingMode" value="fast" />
            </div>

            <label>
              问题类型
              <select name="questionType">
                <option value="career">事业</option>
                <option value="relationship">感情</option>
                <option value="study">学业</option>
                <option value="finance">财运</option>
              </select>
            </label>
            <label>
              起卦方式
              <select name="castingMethod">
                <option value="coin">铜钱法</option>
                <option value="manual">手动录入</option>
              </select>
            </label>
            <p class="hint">铜钱法可不填爻值，系统会自动模拟六次起卦；手动录入需填写 6 个值（仅 6/7/8/9，逗号分隔）。</p>
            <label>六次爻值（6/7/8/9，逗号分隔）<input name="lineValues" placeholder="7,8,7,9,8,7" /></label>
            <label>咨询问题<textarea name="question" rows="3" placeholder="这次跳槽机会值得抓吗？"></textarea></label>
            <button type="submit" id="submitBtn">开始占卜</button>
          </form>
        </article>

        <article class="panel result-panel">
          <div class="result-head">
            <h2>占卜结果</h2>
            <button id="clearResult" class="ghost">清空</button>
          </div>
          <div id="resultCards" class="cards-wrap">
            <article class="result-card muted"><h3>等待占卜</h3><p>提交后这里会显示最终结果。</p></article>
          </div>
        </article>
      </section>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/result-ui.js"></script>
    <script src="/static/immersive.js"></script>
    <script src="/static/liuyao.js"></script>
    <canvas id="bgCanvas"></canvas>
    <script src="/static/bg-anim.js"></script>
  </body>
</html>
