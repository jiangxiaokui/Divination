<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>塔罗占卜 · 玄镜</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a class="nav-logo" href="/">玄 镜</a>
      <div class="nav-links">
        <a href="/my">我的</a>
        <a href="/bazi">八字</a>
        <a href="/liuyao">六爻</a>
        <a href="/dream">解梦</a>
        <a href="/compatibility">姻缘</a>
        <a href="/name-wuge">姓名</a>
        <a href="/tarot" class="active">塔罗</a>
        <a href="/lots">灵签</a>
      </div>
    </nav>
    <main class="container">
      <section class="hero panel reveal">
        <p class="eyebrow">Module · Tarot</p>
        <h1>塔罗占卜</h1>
        <p class="subtitle">选择主题与牌阵，提交后右侧直接显示抽牌与最终结论。</p>
      </section>

      <section class="module-layout reveal delay-1">
        <article class="panel form-panel">
          <h2>塔罗表单</h2>
          <form id="tarotForm" class="form">
            <div class="form-group">
              <span class="form-label">解读模式</span>
              <div class="mode-toggle">
                <button type="button" class="mode-btn active" data-mode="fast">⚡ 极速</button>
                <button type="button" class="mode-btn" data-mode="deep">🔮 深度</button>
              </div>
              <input type="hidden" name="readingMode" value="fast" />
            </div>

            <label>
              主题
              <select name="questionType">
                <option value="relationship">感情</option>
                <option value="career">事业</option>
                <option value="study">学业</option>
                <option value="self">自我成长</option>
              </select>
            </label>
            <label>
              牌阵
              <select name="spread">
                <option value="single_card">单张牌</option>
                <option value="three_card">三张牌（过去 / 现在 / 未来）</option>
                <option value="celtic_cross">凯尔特十字</option>
              </select>
            </label>
            <label>
              允许逆位
              <select name="allowReversed">
                <option value="true">是</option>
                <option value="false">否</option>
              </select>
            </label>
            <label>咨询问题<textarea name="question" rows="3" placeholder="我该如何推进这段关系？"></textarea></label>
            <button type="submit" id="submitBtn">开始占卜</button>
          </form>
        </article>

        <article class="panel result-panel">
          <div class="result-head">
            <h2>占卜结果</h2>
            <button id="clearResult" class="ghost">清空</button>
          </div>
          <div id="resultCards" class="cards-wrap">
            <article class="result-card muted"><h3>等待占卜</h3><p>提交后这里会显示最终结果。</p></article>
          </div>
        </article>
      </section>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/result-ui.js"></script>
    <script src="/static/immersive.js"></script>
    <script src="/static/tarot.js"></script>
    <canvas id="bgCanvas"></canvas>
    <script src="/static/bg-anim.js"></script>
  </body>
</html>
