<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玄镜 · 管理后台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="aura aura-left"></div>
    <div class="aura aura-right"></div>
    <main class="container">
      <section class="panel reveal">
        <p class="eyebrow">Admin Console</p>
        <h1>玄镜 · 管理后台</h1>
        <p class="subtitle">仅管理员可登录查看入库记录。</p>
      </section>

      <section class="grid">
        <article class="panel reveal delay-1">
          <h2>管理员登录</h2>
          <form id="adminLoginForm" class="form">
            <label>
              用户名
              <input name="username" required placeholder="admin" />
            </label>
            <label>
              密码
              <input name="password" type="password" required placeholder="请输入管理员密码" />
            </label>
            <button type="submit">登录</button>
          </form>
          <button id="logoutBtn" class="ghost" style="margin-top: 10px">退出登录</button>
          <p class="hint" id="loginState">未登录</p>
        </article>

        <article class="panel reveal delay-2">
          <h2>运行状态</h2>
          <form id="runtimeForm" class="form inline">
            <button type="submit">刷新状态</button>
          </form>
          <div id="runtimeSummary" class="admin-runtime-grid">
            <div class="admin-empty">请先登录后查看...</div>
          </div>
          <div id="runtimeMeta" class="admin-inline-list"></div>
        </article>
      </section>

      <section class="panel reveal delay-3">
        <div class="result-head">
          <h2>最近占卜记录</h2>
          <form id="recordsForm" class="form inline">
            <select name="queryMode">
              <option value="all">默认查询: 最近全部</option>
              <option value="has_name">非默认: 已填写姓名/对象</option>
              <option value="has_question">非默认: 已填写问题</option>
              <option value="has_name_and_question">非默认: 姓名和问题都已填</option>
              <option value="has_name_or_question">非默认: 姓名或问题任一已填</option>
            </select>
            <input name="limit" type="number" min="1" max="200" value="50" />
            <button type="submit">加载记录</button>
          </form>
        </div>
        <div id="recordsSummary" class="admin-metric-grid">
          <div class="admin-empty">请先登录后加载记录...</div>
        </div>
        <div id="moduleSummary" class="admin-chip-row"></div>
        <div class="admin-records-layout">
          <div class="admin-table-shell">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>记录</th>
                  <th>模块</th>
                  <th>姓名/对象</th>
                  <th>问题</th>
                  <th>用户</th>
                  <th>置信度</th>
                  <th>LLM</th>
                  <th>时间</th>
                  <th>详情</th>
                </tr>
              </thead>
              <tbody id="recordsTableBody"></tbody>
            </table>
            <p id="recordsEmpty" class="admin-empty">请先登录后加载记录...</p>
          </div>

          <aside id="recordDetail" class="admin-detail-panel">
            <p class="admin-detail-placeholder">选择一条记录后，可查看入库详情、输入参数和原始结果。</p>
          </aside>
        </div>
      </section>
    </main>

    <script src="/static/admin.js"></script>
  </body>
</html>
